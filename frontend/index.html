                  <div
                    style={{ display: "flex", flexWrap: "wrap", gap: "0.6rem" }}
                  >
                    {!cameraActive ? (
                      <button className="btn-primary" onClick={startCamera}>
                        <CameraIcon /> Start Camera
                      </button>
                    ) : (
                      <>
                        <button
                          className="btn-primary"
                          onClick={toggleLiveScan}
                          style={{
                            background: liveAutoScan ? "#DC2626" : "#0D9488",
                            boxShadow: liveAutoScan
                              ? "0 4px 14px rgba(220,38,38,0.3)"
                              : "0 4px 14px rgba(13,148,136,0.3)",
                          }}
                        >
                          <SparklesIcon />{" "}
                          {liveAutoScan
                            ? "Stop Live Auto-Scan"
                            : "Start Live Auto-Scan"}
                        </button>
                        <button
                          className="btn-primary"
                          onClick={captureAndAnalyze}
                          disabled={loading || liveAutoScan}
                          style={{
                            background: "#2563EB",
                            boxShadow: "0 4px 14px rgba(37,99,235,0.3)",
                          }}
                        >
                          <CameraIcon /> Capture & Analyze Photo
                        </button>
                        <button
                          className="btn-secondary"
                          onClick={stopCamera}
                          style={{
                            background: "#FEF2F2",
                            color: "#991B1B",
                            borderColor: "#FCA5A5",
                          }}
                        >
                          Stop Camera
                        </button>
                      </>
                    )}
                  </div>

                  <div>
                    <label
                      className="btn-secondary"
                      style={{
                        padding: "0.65rem 1.2rem",
                        fontSize: "0.88rem",
                        cursor: "pointer",
                      }}
                    >
                      Upload Photo
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleFileUpload}
                        style={{ display: "none" }}
                      />
                    </label>
                  </div>
                </div>

                {/* Status Message / Notification */}
                {statusMsg && (
                  <div
                    style={{
                      marginTop: "0.9rem",
                      background: "#EBF5F0",
                      border: "1px solid #C3E2D5",
                      color: "#1B4D3E",
                      padding: "0.65rem 1rem",
                      borderRadius: "8px",
                      fontSize: "0.85rem",
                      display: "flex",
                      alignItems: "center",
                      gap: "0.5rem",
                    }}
                  >
                    <SparklesIcon /> {statusMsg}
                  </div>
                )}

                {errorMsg && (
                  <div
                    style={{
                      marginTop: "0.9rem",
                      background: "#FEF2F2",
                      border: "1px solid #FCA5A5",
                      color: "#991B1B",
                      padding: "0.65rem 1rem",
                      borderRadius: "8px",
                      fontSize: "0.85rem",
                    }}
                  >
                    {errorMsg}
                  </div>
                )}
              </div>

              {/* Right Column: Diagnostic HUD & Recommendations */}
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: "1.5rem",
                }}
              >
                {scanResult && scanResult.face_detected ? (
                  <>
                    {/* Primary Emotion Status Card */}
                    <div className="glass-card" style={{ padding: "1.75rem" }}>
                      <div
                        style={{
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                        }}
                      >
                        <span
                          className={`metric-badge ${getEmotionBadgeClass(scanResult.emotion)}`}
                        >
                          {scanResult.emotion.toUpperCase()} STATE
                        </span>
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: "0.6rem",
                          }}
                        >
                          {scanResult.database_synced && (
                            <span
                              style={{
                                fontSize: "0.74rem",
                                background: "#EBF5F0",
                                color: "#1B4D3E",
                                padding: "0.2rem 0.55rem",
                                borderRadius: "4px",
                                fontWeight: 700,
                                border: "1px solid #C3E2D5",
                              }}
                            >
                              ✓ amicare.db Logged #{scanResult.record_id}
                            </span>
                          )}
                          <span
                            style={{
                              fontSize: "0.8rem",
                              color: "var(--text-muted)",
                            }}
                          >
                            Confidence:{" "}
                            {Math.round((scanResult.confidence || 0.88) * 100)}%
                          </span>
                        </div>
                      </div>

                      <h2
                        style={{
                          fontSize: "1.9rem",
                          margin: "0.85rem 0 0.25rem",
                        }}
                      >
                        {getEmotionTitle(scanResult.emotion)}
                      </h2>
                      <p
                        style={{
                          color: "var(--text-secondary)",
                          fontSize: "0.95rem",
                        }}
                      >
                        {scanResult.state_label}
                      </p>

                      {/* Stress Meter */}
                      <div
                        style={{
                          marginTop: "1.5rem",
                          background: "#FAFBF9",
                          padding: "1.25rem",
                          borderRadius: "var(--radius-md)",
                          border: "1px solid var(--glass-border)",
                        }}
                      >
                        <div
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center",
                          }}
                        >
                          <span style={{ fontSize: "0.9rem", fontWeight: 700 }}>
                            Facial Stress Index
                          </span>
                          <span
                            style={{
                              fontSize: "1.2rem",
                              fontWeight: 800,
                              color: getStressColor(scanResult.stress_score),
                            }}
                          >
                            {scanResult.stress_score}% (
                            {scanResult.stress_level})
                          </span>
                        </div>
                        <div className="stress-bar-outer">
                          <div
                            className="stress-bar-inner"
                            style={{
                              width: `${scanResult.stress_score}%`,
                              backgroundColor: getStressColor(
                                scanResult.stress_score,
                              ),
                            }}
                          />
                        </div>
                        {liveHistory.length > 1 && (
                          <div style={{ marginTop: "1rem" }}>
                            <div
                              style={{
                                display: "flex",
                                justifyContent: "space-between",
                                fontSize: "0.75rem",
                                color: "var(--text-muted)",
                                marginBottom: "0.35rem",
                              }}
                            >
                              <span>Live Stress Trend (Last {liveHistory.length} scans)</span>
                              {scanResult.inference_ms > 0 && (
                                <span>OpenCV: {scanResult.inference_ms} ms</span>
                              )}
                            </div>
                            <div
                              style={{
                                display: "flex",
                                alignItems: "flex-end",
                                gap: "4px",
                                height: "38px",
                                padding: "4px 6px",
                                background: "#F1F5F9",
                                borderRadius: "6px",
                              }}
                            >
                              {liveHistory.map((item, idx) => (
                                <div
                                  key={idx}
                                  title={`${item.time}: ${item.emotion} (${item.score}%)`}
                                  style={{
                                    flex: 1,
                                    height: `${Math.max(15, item.score)}%`,
                                    backgroundColor: getStressColor(item.score),
                                    borderRadius: "3px 3px 0 0",
                                    transition: "height 0.25s ease",
                                  }}
                                />
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Facial Indicators Breakdown */}
                    <div className="glass-card" style={{ padding: "1.75rem" }}>
                      <h3
                        style={{
                          fontSize: "1.15rem",
                          marginBottom: "1rem",
                          display: "flex",
                          alignItems: "center",
                          gap: "0.5rem",
                        }}
                      >
                        <SparklesIcon /> Facial Indicators Analysis
                      </h3>

                      <div
                        style={{
                          display: "flex",
                          flexDirection: "column",
                          gap: "1rem",
                          fontSize: "0.9rem",
                        }}
                      >
                        <div>
                          <div
                            style={{
                              display: "flex",
                              justifyContent: "space-between",
                              marginBottom: "0.25rem",
                            }}
                          >
                            <span style={{ color: "var(--text-secondary)" }}>
                              Mouth Openness / Jaw Strain
                            </span>
                            <span style={{ fontWeight: 700 }}>
                              {scanResult.indicators.mouth_openness_percent || 0}%
                            </span>
                          </div>
                          <div
                            style={{
                              height: "6px",
                              background: "#E2E8F0",
                              borderRadius: "4px",
                              overflow: "hidden",
                            }}
                          >
                            <div
                              style={{
                                width: `${Math.min(100, scanResult.indicators.mouth_openness_percent || 0)}%`,
                                height: "100%",
                                background:
                                  (scanResult.indicators.mouth_openness_percent || 0) >= 48
                                    ? "#DC2626"
                                    : "#0D9488",
                              }}
                            />
                          </div>
                        </div>

                        <div>
                          <div
                            style={{
                              display: "flex",
                              justifyContent: "space-between",
                              marginBottom: "0.25rem",
                            }}
                          >
                            <span style={{ color: "var(--text-secondary)" }}>
                              Forehead Brow Furrow Strain
                            </span>
                            <span style={{ fontWeight: 700 }}>
                              {scanResult.indicators.forehead_tension_percent ||
                                0}
                              %
                            </span>
                          </div>
                          <div
                            style={{
                              height: "6px",
                              background: "#E2E8F0",
                              borderRadius: "4px",
                              overflow: "hidden",
                            }}
                          >
                            <div
                              style={{
                                height: "100%",
                                width: `${scanResult.indicators.forehead_tension_percent || 0}%`,
                                background: "#C2410C",
                              }}
                            />
                          </div>
                        </div>

                        <div>
                          <div
                            style={{
                              display: "flex",
                              justifyContent: "space-between",
                              marginBottom: "0.25rem",
                            }}
                          >
                            <span style={{ color: "var(--text-secondary)" }}>
                              Smile & Mouth Valence Ratio
                            </span>
                            <span style={{ fontWeight: 700 }}>
                              {scanResult.indicators.smile_ratio || 0}
                            </span>
                          </div>
                          <div
                            style={{
                              height: "6px",
                              background: "#E2E8F0",
                              borderRadius: "4px",
                              overflow: "hidden",
                            }}
                          >
                            <div
                              style={{
                                height: "100%",
                                width: `${Math.min(100, ((scanResult.indicators.smile_ratio || 0) / 1.1) * 100)}%`,
                                background: "#2A725D",
                              }}
                            />
                          </div>
                        </div>

                        <div
                          style={{
                            borderTop: "1px solid var(--glass-border)",
                            paddingTop: "0.75rem",
                            marginTop: "0.25rem",
                          }}
                        >
                          <div
                            style={{
                              fontSize: "0.8rem",
                              color: "var(--text-muted)",
                            }}
                          >
                            PRIMARY BIOMETRIC CUE
                          </div>
                          <div
                            style={{
                              fontWeight: 600,
                              color: "var(--text-main)",
                              marginTop: "0.25rem",
                            }}
                          >
                            {scanResult.primary_indicator}
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* AmiCare Personalized Guidance */}
                    <div
                      className="glass-card"
                      style={{
                        padding: "1.75rem",
                        background: "#F8FAF9",
                        borderColor: "#C3E2D5",
                      }}
                    >
                      <h4
                        style={{
                          fontSize: "1.05rem",
                          color: "var(--primary-teal)",
                          display: "flex",
                          alignItems: "center",
                          gap: "0.45rem",
                          marginBottom: "0.65rem",
                        }}
                      >
                        <HeartIcon /> AmiCare Adaptive Coping Guidance
                      </h4>
                      <p
                        style={{
                          fontSize: "0.92rem",
                          color: "var(--text-main)",
                          lineHeight: "1.5",
                          marginBottom: "1.25rem",
                        }}
                      >
                        {scanResult.recommendation}
                      </p>

                      <div
                        style={{
                          display: "flex",
                          flexWrap: "wrap",
                          gap: "0.6rem",
                        }}
                      >
                        {scanResult.emotion === "Stressed" && (
                          <button
                            className="btn-primary"
                            onClick={() => onNavigateTab("breathing")}
                          >
                            <WindIcon /> Start Box Breathing
                          </button>
                        )}
                        {scanResult.emotion === "Sad" && (
                          <button
                            className="btn-primary"
                            onClick={() => onNavigateTab("helplines")}
                          >
                            <PhoneIcon /> View Emergency Helplines
                          </button>
                        )}
                        <button
                          className="btn-secondary"
                          onClick={() => onNavigateTab("chatbot")}
                        >
                          <BotIcon /> Discuss with AmiCare AI
                        </button>
                      </div>

                      {scanResult.recommended_helplines &&
                        scanResult.recommended_helplines.length > 0 && (
                          <div
                            style={{
                              marginTop: "1.25rem",
                              paddingTop: "1rem",
                              borderTop: "1px solid var(--glass-border)",
                            }}
                          >
                            <div
                              style={{
                                fontSize: "0.78rem",
                                fontWeight: 700,
                                color: "var(--text-muted)",
                                textTransform: "uppercase",
                                marginBottom: "0.5rem",
                                display: "flex",
                                alignItems: "center",
                                gap: "0.4rem",
                              }}
                            >
                              <PhoneIcon className="icon-svg" /> Verified
                              Support Lines (from Database)
                            </div>
                            <div
                              style={{
                                display: "flex",
                                flexDirection: "column",
                                gap: "0.45rem",
                              }}
                            >
                              {scanResult.recommended_helplines.map(
                                (h, idx) => (
                                  <div
                                    key={idx}
                                    style={{
                                      display: "flex",
                                      justifyContent: "space-between",
                                      alignItems: "center",
                                      background: "#FFFFFF",
                                      padding: "0.55rem 0.85rem",
                                      borderRadius: "8px",
                                      border: "1px solid var(--glass-border)",
                                    }}
                                  >
                                    <div>
                                      <span
                                        style={{
                                          fontSize: "0.86rem",
                                          fontWeight: 700,
                                          color: "var(--text-main)",
                                        }}
                                      >
                                        {h.name}
                                      </span>
                                      <span
                                        style={{
                                          fontSize: "0.75rem",
                                          color: "var(--text-muted)",
                                          marginLeft: "0.5rem",
                                        }}
                                      >
                                        ({h.category})
                                      </span>
                                    </div>
                                    <a
                                      href={`tel:${h.number.split("/")[0].trim()}`}
                                      className="btn-secondary"
                                      style={{
                                        padding: "0.3rem 0.65rem",
                                        fontSize: "0.78rem",
                                        textDecoration: "none",
                                      }}
                                    >
                                      <PhoneIcon className="icon-svg" />{" "}
                                      {h.number.split("/")[0].trim()}
                                    </a>
                                  </div>
                                ),
                              )}
                            </div>
                          </div>
                        )}
                    </div>
                  </>
                ) : (
                  <div
                    className="glass-card"
                    style={{ padding: "2.5rem 1.75rem", textAlign: "center" }}
                  >
                    <div
                      style={{
                        width: "56px",
                        height: "56px",
                        margin: "0 auto 1.25rem",
                        background: "#EBF5F0",
                        borderRadius: "50%",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        color: "var(--primary-teal)",
                      }}
                    >
                      <CameraIcon className="icon-svg large" />
                    </div>
                    <h3 style={{ fontSize: "1.25rem", marginBottom: "0.6rem" }}>
                      Facial Analysis Awaiting Input
                    </h3>
                    <p
                      style={{
                        color: "var(--text-secondary)",
                        fontSize: "0.9rem",
                        lineHeight: "1.5",
                        marginBottom: "1.5rem",
                      }}
                    >
                      Start your camera or upload a student portrait above to
                      examine facial tension and emotional state with OpenCV.
                    </p>
                    <div
                      style={{
                        background: "#FAFBF9",
                        border: "1px solid var(--glass-border)",
                        padding: "1rem",
                        borderRadius: "var(--radius-md)",
                        textAlign: "left",
                        fontSize: "0.85rem",
                        color: "var(--text-muted)",
                      }}
                    >
                      <strong>How OpenCV evaluates stress:</strong>
                      <ul
                        style={{
                          paddingLeft: "1.2rem",
                          marginTop: "0.5rem",
                          lineHeight: "1.6",
                        }}
                      >
                        <li>
                          <strong>Brow Furrowing:</strong> Measures
                          micro-wrinkles and muscle contraction above the nose.
                        </li>
                        <li>
                          <strong>Smile Valence:</strong> Compares mouth corner
                          elevation against eye width.
                        </li>
                        <li>
                          <strong>Stress Level:</strong> Classifies student into
                          Well, Happy, Sad, or Stressed.
                        </li>
                      </ul>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [tab, setTab] = useState("chatbot");
        return (
          <div>
            <Navbar activeTab={tab} setActiveTab={setTab} />
            {tab === "chatbot" && <ChatbotLanding onNavigateTab={setTab} />}
            {tab === "facescan" && <FaceStressScan onNavigateTab={setTab} />}
            {tab === "helplines" && <Helplines />}
            {tab === "breathing" && <Breathing />}
            {tab === "resources" && <Resources />}

            <footer className="footer container">
              <div className="disclaimer-box">
                <strong>Non-Diagnostic Disclaimer:</strong> AmiCare is designed
                solely as a conversational self-reflection tool and helpline
                referral directory for students. If in emergency crisis, call
                14416 (Tele-MANAS) or 1800-599-0019 (KIRAN).
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
